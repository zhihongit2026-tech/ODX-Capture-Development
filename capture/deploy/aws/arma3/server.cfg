// Arma 3 dedicated server for Odx test rounds (document/games/arma3.md §5), copied to /opt/arma3/odx/ by create-arma3.sh.
hostname = "Odx Arma 3 test";
password = "odx";
passwordAdmin = "odx-admin";
maxPlayers = 64;

// Official anti-cheat off switch: clients join without BattlEye. Addon signatures are not checked either: the odx_capture
// client addon (OdxArma3.exe) is unsigned, and the server is private and password-protected.
BattlEye = 0;
verifySignatures = 0;
allowedFilePatching = 0;
kickDuplicate = 1;
upnp = 0;
persistent = 0;
disableVoN = 0;
vonCodecQuality = 10;
motd[] = {};

// The HUD flags live in the Custom preset of /opt/arma3/profile/odx.Arma3Profile.
forcedDifficulty = "Custom";

class Missions
{
	class Odx
	{
		template = "odx_test.stratis";
		difficulty = "Custom";
	};
};
